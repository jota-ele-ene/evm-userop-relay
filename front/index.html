<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay AA - JsonRegistry</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 820px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.5;
    }
    form {
      display: grid;
      gap: 12px;
    }
    textarea {
      min-height: 260px;
      padding: 12px;
      font-size: 15px;
      font-family: monospace;
    }
    button {
      width: fit-content;
      padding: 10px 16px;
      cursor: pointer;
    }
    .hint {
      color: #555;
      font-size: 14px;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f6f6f6;
      padding: 16px;
      border-radius: 8px;
    }
    #response {
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <h1>Registrar JSON vía Account Abstraction</h1>
  <p class="hint">
    Rellena los campos del JSON. <strong>title</strong> y <strong>body</strong> son obligatorios.
  </p>

  <form id="payloadForm">
    <label for="contractAddress">Dirección del contrato</label>
    <input id="contractAddress" name="contractAddress" type="text" required placeholder="0x..." />

    <label for="network">Red</label>
    <select id="network" name="network" required>
      <option value="" disabled selected>Cargando redes...</option>
    </select>

    <label for="functionSelect">Función</label>
    <select id="functionSelect" name="functionSelect" disabled>
      <option value="" disabled selected>Introduce dirección y red</option>
    </select>

    <div id="abiStatus" class="hint">Selecciona una red e introduce la dirección del contrato para cargar el ABI automáticamente.</div>
    <div id="functionFields"></div>

    <button type="submit" id="submitButton" disabled>Enviar UserOperation</button>
  </form>

  <div id="response"></div>
  <script src="app.js" defer></script>
</body>
</html>
